name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run (saves macOS minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # komorebi for Mac is Apple silicon only, and so is this app.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Test
        run: make test

      - name: Bundle
        run: make bundle

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: KomorebiMenubar.app
          path: build/KomorebiMenubar.app
          retention-days: 7
